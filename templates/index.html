<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantina Bot - Extrator de Vendas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="min-h-screen px-4 py-10">
        <div class="mx-auto flex w-full max-w-5xl flex-col gap-8 rounded-3xl border border-white/10 bg-white/5 p-6 shadow-2xl shadow-cyan-950/30 backdrop-blur md:p-10">
            <section class="space-y-3">
                <p class="text-sm uppercase tracking-[0.35em] text-cyan-300/80">Cantina Bot</p>
                <h1 class="text-3xl font-black tracking-tight text-white md:text-5xl">Cantina Bot - Extrator de Vendas</h1>
                <p class="max-w-2xl text-sm text-slate-300 md:text-base">Digite a mensagem da venda e envie para extrair os dados estruturados em JSON.</p>
            </section>

            <section class="grid gap-6 lg:grid-cols-[1.1fr_0.9fr]">
                <form id="saleForm" class="space-y-4 rounded-2xl border border-white/10 bg-slate-900/70 p-5 shadow-lg shadow-black/20">
                    <div class="space-y-2">
                        <label for="customerName" class="block text-sm font-semibold text-slate-200">Nome</label>
                        <input id="customerName" type="text" class="w-full rounded-2xl border border-white/10 bg-slate-950/80 p-4 text-slate-100 outline-none transition placeholder:text-slate-500 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/30" placeholder="Ex: Maria" />
                    </div>

                    <div class="space-y-2">
                        <label for="saleTotal" class="block text-sm font-semibold text-slate-200">Total da venda</label>
                        <input id="saleTotal" type="number" step="0.01" min="0" class="w-full rounded-2xl border border-white/10 bg-slate-950/80 p-4 text-slate-100 outline-none transition placeholder:text-slate-500 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/30" placeholder="Ex: 15.50" />
                    </div>

                    <label for="saleText" class="block text-sm font-semibold text-slate-200">Mensagem da venda</label>
                    <textarea id="saleText" rows="8" class="w-full rounded-2xl border border-white/10 bg-slate-950/80 p-4 text-slate-100 outline-none transition placeholder:text-slate-500 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/30" placeholder="Ex: 2 águas e 1 bolo no pix"></textarea>
                    <button type="submit" class="inline-flex w-full items-center justify-center rounded-2xl bg-cyan-400 px-5 py-3 font-semibold text-slate-950 transition hover:bg-cyan-300 active:scale-[0.99]">
                        Registrar Venda
                    </button>
                </form>

                <section class="rounded-2xl border border-white/10 bg-slate-900/70 p-5 shadow-lg shadow-black/20">
                    <div class="mb-4 flex items-center justify-between gap-3">
                        <h2 class="text-sm font-semibold uppercase tracking-[0.2em] text-slate-400">Resultado</h2>
                        <span id="statusBadge" class="rounded-full border border-white/10 bg-white/5 px-3 py-1 text-xs font-semibold text-slate-300">Aguardando</span>
                    </div>

                    <div id="feedback" class="mb-4 hidden rounded-2xl border border-rose-500/30 bg-rose-500/10 p-3 text-sm text-rose-200"></div>

                    <pre class="min-h-[22rem] overflow-auto rounded-2xl border border-white/10 bg-slate-950/90 p-4 text-sm leading-6 text-slate-200"><code id="resultCode">{}</code></pre>
                </section>
            </section>
        </div>
    </main>

    <script>
        const form = document.getElementById('saleForm');
        const customerName = document.getElementById('customerName');
        const saleTotal = document.getElementById('saleTotal');
        const saleText = document.getElementById('saleText');
        const resultCode = document.getElementById('resultCode');
        const feedback = document.getElementById('feedback');
        const statusBadge = document.getElementById('statusBadge');

        function showError(message) {
            feedback.textContent = message;
            feedback.classList.remove('hidden');
            statusBadge.textContent = 'Erro';
            statusBadge.className = 'rounded-full border border-rose-500/30 bg-rose-500/10 px-3 py-1 text-xs font-semibold text-rose-200';
        }

        function showSuccess(data) {
            feedback.classList.add('hidden');
            statusBadge.textContent = 'OK';
            statusBadge.className = 'rounded-full border border-emerald-500/30 bg-emerald-500/10 px-3 py-1 text-xs font-semibold text-emerald-200';
            resultCode.textContent = JSON.stringify(data, null, 2);
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const text = saleText.value.trim();
            const nome = customerName.value.trim();
            const total = saleTotal.value.trim();
            if (!text) {
                showError('Digite uma mensagem antes de registrar a venda.');
                return;
            }

            feedback.classList.add('hidden');
            statusBadge.textContent = 'Enviando';
            statusBadge.className = 'rounded-full border border-cyan-500/30 bg-cyan-500/10 px-3 py-1 text-xs font-semibold text-cyan-200';

            try {
                const response = await fetch('/webhook', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text, nome, total })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Falha ao registrar venda.');
                }

                showSuccess(data);
            } catch (error) {
                showError(error.message || 'Falha ao registrar venda.');
            }
        });
    </script>
</body>
</html>
